[package]
name = "melly-ide-desktop"
version = "0.7.0-alpha.3"
edition = "2021"
license = "Apache-2.0"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
uuid = { version = "=1.27.0", features = ["v4"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
sha1_smol = { version = "=1.0.1" }
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging"] }
